name: release
on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:
jobs:
  release:
    permissions:
      contents: write
    uses: nimbase/setup-nim-action/.github/workflows/release_clue.yml@main
    with:
      nim-version: '2.2.10'
      app-name: tim
      pre-release-command: |
        clue install https://github.com/nimbase/nimbase --build