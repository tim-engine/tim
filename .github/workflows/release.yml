name: release
on:
  workflow_dispatch:
    inputs:
      test_version:
        description: "Test version (manual dispatch without a tag)"
        required: false
        default: ""
  push:
    tags:
      - '*.*.*'
env:
  APP_NAME: 'tim'
  NIM_VERSION: '2.2.10'
  MAINTAINER: 'OpenPeeps'
jobs:
  build-artifact:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macOS-latest
    steps:
      - uses: actions/checkout@v4
      - uses: georgelemon/setup-nim-action@master
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upgrade nimble
        run: nimble install -Y nimble

      - name: "Install language runtime dependencies"
        if: runner.os != 'Windows'
        run: |
          if [[ "${{ runner.os }}" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y \
              libluajit-5.1-dev luajit \
              php-cli php-dev \
              ruby ruby-dev \
              python3 python3-dev python3-pip
          elif [[ "${{ runner.os }}" == macOS ]]; then
            brew install \
              luajit \
              php \
              ruby \
              python3
          fi

      - name: "Install cmake-js for building node bindings"
        run: "npm install cmake-js -g"

      - name: "Install Denim + Clue"
        run: |
          nimble install -y denim@#head
          nimble install -y clue@#head

      - name: "Build tim CLI"
        run: nimble build -Y -d:release

      - name: "Build Node.js addon"
        run: denim build src/tim.nim -r -y --cmake

      - name: "Build PHP extension"
        if: runner.os != 'Windows'
        run: nimble php

      - name: "Build Ruby extension"
        if: runner.os != 'Windows'
        run: nimble ruby

      - name: "Build Python extension"
        if: runner.os != 'Windows'
        run: nimble python

      - name: "Build Lua extension"
        if: runner.os != 'Windows'
        run: nimble lua

      - name: "Create artifact"
        run: |
          os="${{ runner.os }}"
          assets="${{ env.APP_NAME }}_$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')"
          echo "$assets"
          mkdir -p "dist/$assets"
          cp -r bin LICENSE README.* "dist/$assets/"
          mkdir -p "dist/$assets/extensions"
          if [[ "${{ runner.os }}" != Windows ]]; then
            cp build/tim_php.so "dist/$assets/extensions/" 2>/dev/null || true
            cp build/Tim.bundle "dist/$assets/extensions/" 2>/dev/null || true
            cp build/tim.so "dist/$assets/extensions/tim_python.so" 2>/dev/null || true
            cp build/tim.so "dist/$assets/extensions/tim_lua.so" 2>/dev/null || true
          fi
          if test -f bin/tim.node; then
            cp bin/tim.node "dist/$assets/extensions/" 2>/dev/null || true
          fi
          (
            cd dist
            if [[ "${{ runner.os }}" == Windows ]]; then
              7z a "$assets.zip" "$assets"
            else
              tar czf "$assets.tar.gz" "$assets"
            fi
            ls -lah *.*
          )
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    needs:
      - build-artifact
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: artifact-ubuntu-latest
          path: dist

      - name: "Create Release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Release" \
            --draft=false \
            --prerelease=false \
            dist/*.tar.gz dist/*.zip

  trigger-ruby-build:
    needs: build-artifact
    runs-on: ubuntu-latest
    steps:
      - name: "Dispatch Ruby extension build to tim-engine/tim-ruby"
        env:
          GH_TOKEN: ${{ secrets.TIM_EXT_PAT }}
        run: |
          VERSION="${{ github.event.inputs.test_version || github.ref_name }}"
           jq -n --arg v "${VERSION#v}" \
            '{event_type: "build-ruby", client_payload: {version: $v}}' |
            gh api repos/tim-engine/tim-ruby/dispatches --input -
