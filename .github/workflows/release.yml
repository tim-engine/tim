name: release
# Tag-driven releases: pushing a tag like `v0.2.10` (or dispatching by
# hand with a version input) builds the `tim` CLI binaries and the NAPI
# addons, attaches everything to the GitHub Release, and publishes
# `@openpeeps/tim` to npm with the addon binaries included.
#
# The run builds the CLI for Linux (x64) and macOS (arm64), plus the
# NAPI addons for macOS (arm64/x64) and Linux (x64).
#
# aarch64 Linux is not built: clue (which resolves the `cli` feature
# deps the addon needs) ships no Linux ARM64 binary, so dependency
# installation cannot run there. aarch is covered via macOS arm64;
# `addons/tim_napi` already supports a `linux-arm64` slot for later.
#
# Windows CLI is not built yet: no Windows CI coverage exists for the
# Nim CLI target. Add it once a Windows test job lands.
#
# NB: never compile `src/tim.nim` directly (`nim c` / `clue build`
# won't resolve the feature deps for a bare invocation). The NAPI build
# always goes through the custom denim command below, which defines
# `-d:napibuild` while `src/tim.nims` mirrors the `cli` feature paths
# from `clue.lock` (see the comment there for why a define alone
# cannot enable feature deps under denim).
on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release and publish to npm (e.g. 0.2.10)'
        required: true
        type: string
jobs:
  prep:
    name: resolve tag and version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          set -eu
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="v${{ inputs.version }}"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  cli:
    name: CLI binaries
    needs: prep
    uses: nimbase/setup-nim-action/.github/workflows/release_clue.yml@main
    with:
      app-name: tim
      test: false
      create-release: false
      # Pinned runners whose `artifact-<os>-<arch>` names cannot collide
      # with the napi job's (macos-14, macos-15-intel, ubuntu-24.04).
      # ubuntu-22.04 doubles as the oldest glibc baseline, so the Linux
      # binary also runs on newer distros.
      target-matrix: '[{"os":"ubuntu-22.04","arch":"x86_64"},{"os":"macos-15","arch":"arm64"}]'

  napi:
    name: napi addons
    needs: prep
    uses: nimbase/setup-nim-action/.github/workflows/release_clue.yml@main
    with:
      app-name: node_addon
      test: false
      pre-build-command: >-
        nimble install -y https://github.com/openpeeps/denim &&
        (npm install -g cmake-js ||
        (npm install --prefix "$HOME/.cmake-js" cmake-js &&
        echo "$HOME/.cmake-js/bin" >> "$GITHUB_PATH"))
      build-command: denim build src/tim.nim --cmake -y && node addons/tim_napi/scripts/place-binary.js && npm test --prefix addons/tim_napi
      binary: bin/tim.node
      target-matrix: '[{"os":"macos-14","arch":"arm64"},{"os":"macos-15-intel","arch":"x86_64"},{"os":"ubuntu-24.04","arch":"x86_64"}]'
      create-release: true
      release-tag: ${{ needs.prep.outputs.tag }}

  attach-cli:
    name: attach CLI binaries to release
    runs-on: ubuntu-latest
    needs: [cli, napi]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          path: dist
          merge-multiple: true

      - name: Upload CLI archives to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          shopt -s nullglob
          tag="${{ needs.prep.outputs.tag }}"
          assets=(dist/tim_*.tar.gz dist/tim_*.zip)
          (( ${#assets[@]} > 0 )) || { echo "ERROR: no tim archives in dist/"; exit 1; }
          printf '%s\n' "${assets[@]}"
          gh release upload "${tag}" "${assets[@]}" --clobber

  npm-publish:
    name: npm publish
    runs-on: ubuntu-latest
    needs: napi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          path: dist
          merge-multiple: true

      - name: Assemble per-arch binaries
        shell: bash
        run: |
          set -eu
          pkg=addons/tim_napi
          # Map each release archive to its npm package slot.
          # Archive names come from release_clue as <app>_<runner-os>-<arch>
          # (lowercased), e.g. node_addon_macos-arm64.tar.gz.
          declare -A slots=(
            [node_addon_macos-arm64.tar.gz]=darwin-arm64
            [node_addon_macos-x86_64.tar.gz]=darwin-x64
            [node_addon_linux-x86_64.tar.gz]=linux-x64
          )
          for archive in "${!slots[@]}"; do
            [[ -f "dist/${archive}" ]] || { echo "ERROR: missing ${archive}"; exit 1; }
            work="$(mktemp -d)"
            tar xzf "dist/${archive}" -C "${work}"
            node_bin="$(find "${work}" -name 'tim.node' | head -n 1)"
            [[ -n "${node_bin}" ]] || { echo "ERROR: no tim.node in ${archive}"; exit 1; }
            dest="${pkg}/bin/${slots[${archive}]}"
            mkdir -p "${dest}"
            cp "${node_bin}" "${dest}/tim.node"
            rm -rf "${work}"
          done
          find "${pkg}/bin" -name '*.node' | sort

      - name: Sync version from input
        working-directory: addons/tim_napi
        shell: bash
        run: |
          set -eu
          version="${VERSION#v}"
          echo "Syncing npm version to ${version}"
          npm pkg set version="${version}"
          node -p "require('./package.json').version"
        env:
          VERSION: ${{ needs.prep.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Smoke test assembled package
        shell: bash
        run: npm test --prefix addons/tim_napi

      - name: Publish to npm
        working-directory: addons/tim_napi
        shell: bash
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
