name: release
# Tag-driven releases: pushing a tag like `v0.2.10` (or dispatching by
# hand with a version input) builds the `tim` CLI binaries and the NAPI
# addons, attaches everything to the GitHub Release, and publishes
# `@openpeeps/tim` to npm with the addon binaries included.
#
# The run builds the CLI for Linux (x64/arm64) and macOS (arm64/x64),
# plus the NAPI addons for macOS (arm64/x64) and Linux (x64/arm64), plus the
# browser playground (`tim.wasm` + `tim.js` glue, no backend needed).
#
# The CLI macOS builds run on the macos-26 labels: the macos-15 labels
# are taken by the napi job below, and release_clue names artifacts
# `artifact-<os>-<arch>`, so sharing a label would lose one job's
# archives (as happened in the 0.2.10 run). macOS 26 is therefore the
# CLI's minimum version. Linux arm64 builds on ubuntu-22.04-arm; clue
# ships a linux-arm64 binary, so dependency installation works there.
# The wasm build cross-compiles on ubuntu-22.04 (wasi-sdk 34) with the
# `wasm32` arch label, which is only used for artifact/archive names.
# The napi Linux arm64 addon builds on ubuntu-24.04-arm (same image
# family as the x64 addon); the npm package already ships that slot
# (`bin/linux-arm64`, wired in `place-binary.js`/`index.js`).
#
# Windows CLI is not built yet: no Windows CI coverage exists for the
# Nim CLI target. Add it once a Windows test job lands.
#
# NB: never compile `src/tim.nim` directly (`nim c` / `clue build`
# won't resolve the feature deps for a bare invocation). The NAPI build
# always goes through the custom denim command below, which defines
# `-d:napibuild` while `src/tim.nims` mirrors the `cli` feature paths
# from `clue.lock` (see the comment there for why a define alone
# cannot enable feature deps under denim).
on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release and publish to npm (e.g. 0.2.10)'
        required: true
        type: string
jobs:
  prep:
    name: resolve tag and version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          set -eu
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="v${{ inputs.version }}"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  cli:
    name: CLI binaries
    needs: prep
    permissions:
      contents: write
      actions: write
    uses: nimbase/setup-nim-action/.github/workflows/release_clue.yml@main
    with:
      app-name: tim
      test: false
      create-release: false
      # Pinned runners whose `artifact-<os>-<arch>` names cannot collide
      # with the napi job's (macos-15, macos-15-intel, ubuntu-24.04)
      # or the wasm job's (ubuntu-22.04/wasm32).
      # ubuntu-22.04 doubles as the oldest glibc baseline, so the Linux
      # binaries also run on newer distros. macOS builds run on the
      # macos-26 labels (see header comment); Intel via macos-26-intel.
      target-matrix: '[{"os":"ubuntu-22.04","arch":"x86_64"},{"os":"ubuntu-22.04-arm","arch":"arm64"},{"os":"macos-26","arch":"arm64"},{"os":"macos-26-intel","arch":"x86_64"}]'
      build-command: clue build -d:release --features:cli

  napi:
    name: napi addons
    needs: prep
    permissions:
      contents: write
      actions: write
    uses: nimbase/setup-nim-action/.github/workflows/release_clue.yml@main
    with:
      app-name: node_addon
      test: false
      pre-build-command: >-
        nimble install -y https://github.com/openpeeps/denim &&
        (npm install -g cmake-js ||
        (npm install --prefix "$HOME/.cmake-js" cmake-js &&
        echo "$HOME/.cmake-js/bin" >> "$GITHUB_PATH"))
      build-command: denim build src/tim.nim --cmake -y && node addons/tim_napi/scripts/place-binary.js && npm test --prefix addons/tim_napi
      binary: bin/tim.node
      target-matrix: '[{"os":"macos-15","arch":"arm64"},{"os":"macos-15-intel","arch":"x86_64"},{"os":"ubuntu-24.04","arch":"x86_64"},{"os":"ubuntu-24.04-arm","arch":"arm64"}]'
      create-release: true
      release-tag: ${{ needs.prep.outputs.tag }}

  wasm:
    name: wasm playground
    needs: prep
    permissions:
      contents: write
      actions: write
    uses: nimbase/setup-nim-action/.github/workflows/release_clue.yml@main
    with:
      app-name: tim-wasm
      test: false
      create-release: false
      # Pinned to Nim 2.2.x: src/tim.nims rejects 2.4.x by design, and the
      # wasm32 target is verified against 2.2.10 locally.
      nim-version: '2.2.10'
      # `wasm32` is label-only: the build runs on ubuntu-22.04 x64 and
      # cross-compiles via wasi-sdk. The distinct arch keeps the
      # `artifact-<os>-<arch>` name clear of the cli/napi jobs.
      target-matrix: '[{"os":"ubuntu-22.04","arch":"wasm32"}]'
      pre-build-command: >-
        curl -fsSL -o /tmp/wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz &&
        mkdir -p "$HOME/.local/share/wasi-sdk" &&
        tar xzf /tmp/wasi-sdk.tar.gz -C "$HOME/.local/share/wasi-sdk" &&
        echo "WASI_SDK=$HOME/.local/share/wasi-sdk/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
      build-command: clue build -d:wasm -o:build/tim.wasm src/tim.nim
      binary: build/tim.wasm
      extra-files: 'LICENSE README.md bindings/wasm/tim.js'

  attach-cli:
    name: attach CLI and wasm binaries to release
    runs-on: ubuntu-latest
    needs: [prep, cli, napi, wasm]
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          path: dist
          merge-multiple: true

      - name: Upload CLI archives to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          shopt -s nullglob
          tag="${{ needs.prep.outputs.tag }}"
          assets=(dist/tim_*.tar.gz dist/tim_*.zip dist/tim-wasm_*.tar.gz)
          (( ${#assets[@]} > 0 )) || { echo "ERROR: no tim archives in dist/"; exit 1; }
          printf '%s\n' "${assets[@]}"
          gh release upload "${tag}" "${assets[@]}" --clobber

  npm-publish:
    name: npm publish
    runs-on: ubuntu-latest
    needs: [prep, napi]
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          path: dist
          merge-multiple: true

      - name: Assemble per-arch binaries
        shell: bash
        run: |
          set -eu
          pkg=addons/tim_napi
          # Map each release archive to its npm package slot.
          # Archive names come from release_clue as <app>_<runner-os>-<arch>
          # (lowercased), e.g. node_addon_macos-arm64.tar.gz.
          declare -A slots=(
            [node_addon_macos-arm64.tar.gz]=darwin-arm64
            [node_addon_macos-x86_64.tar.gz]=darwin-x64
            [node_addon_linux-x86_64.tar.gz]=linux-x64
            [node_addon_linux-arm64.tar.gz]=linux-arm64
          )
          for archive in "${!slots[@]}"; do
            [[ -f "dist/${archive}" ]] || { echo "ERROR: missing ${archive}"; exit 1; }
            work="$(mktemp -d)"
            tar xzf "dist/${archive}" -C "${work}"
            node_bin="$(find "${work}" -name 'tim.node' | head -n 1)"
            [[ -n "${node_bin}" ]] || { echo "ERROR: no tim.node in ${archive}"; exit 1; }
            dest="${pkg}/bin/${slots[${archive}]}"
            mkdir -p "${dest}"
            cp "${node_bin}" "${dest}/tim.node"
            rm -rf "${work}"
          done
          find "${pkg}/bin" -name '*.node' | sort

      - name: Sync version from input
        working-directory: addons/tim_napi
        shell: bash
        run: |
          set -eu
          version="${VERSION#v}"
          echo "Syncing npm version to ${version}"
          npm pkg set version="${version}"
          node -p "require('./package.json').version"
        env:
          VERSION: ${{ needs.prep.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Smoke test assembled package
        shell: bash
        run: npm test --prefix addons/tim_napi

      - name: Publish to npm
        working-directory: addons/tim_napi
        shell: bash
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
