name: test
on: [push, pull_request]
jobs:
  test:
    uses: nimbase/setup-nim-action/.github/workflows/test_clue.yml@main
    with:
      nim-version: stable
      os: '[{"os":"ubuntu-latest"},{"os":"windows-latest"},{"os":"macos-15-intel"}]'
      pre-install-command: |
        sudo apt-get update
        sudo apt-get install -y \
          libluajit-5.1-dev luajit \
          php-cli php-dev \
          ruby ruby-dev \
          python3 python3-dev python3-pip
        
        npm install cmake-js -g

        nimble install -y denim
        nimble install -y https://github.com/nimbase/nimbase
      pre-test-command: |
        nimble ruby
        nimble php
        nimble python
        nimble lua
