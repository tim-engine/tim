name: test
on: [push, pull_request]
jobs:
  test:
    uses: nimbase/setup-nim-action/.github/workflows/test_clue.yml@main
    with:
      nim-version: stable
      os: '[{"os":"ubuntu-latest"},{"os":"windows-latest"},{"os":"macos-15-intel"}]'
      pre-install-command: |
        npm install cmake-js -g
        clue install denim --build
        clue install https://github.com/nimbase/nimbase --build
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get update
          sudo apt-get install -y \
            libluajit-5.1-dev luajit \
            php-cli php-dev \
            ruby ruby-dev \
            python3 python3-dev python3-pip
        elif [ "$RUNNER_OS" = "macOS" ]; then
          brew install luajit php ruby python3
        elif [ "$RUNNER_OS" = "Windows" ]; then
          choco install -y luajit php ruby python3
        fi
      pre-test-command: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          clue ruby
          clue php
          clue python
          clue lua
        elif [ "$RUNNER_OS" = "macOS" ]; then
          clue ruby
          clue php
          clue python
          clue lua
        elif [ "$RUNNER_OS" = "Windows" ]; then
          clue php
          clue python
          clue lua
        fi
