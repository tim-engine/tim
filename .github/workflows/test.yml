name: test
on: [push, pull_request]
jobs:
  test:
    uses: nimbase/setup-nim-action/.github/workflows/test_clue.yml@main
    with:
      nim-version: stable
      os: '[{"os":"ubuntu-latest"},{"os":"windows-latest"},{"os":"macos-15-intel"}]'
      pre-install-command: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get update
          sudo apt-get install -y \
            libluajit-5.1-dev luajit \
            php-cli php-dev \
            ruby ruby-dev \
            python3 python3-dev python3-pip
        elif [ "$RUNNER_OS" = "macOS" ]; then
          brew install luajit php ruby python3
        elif [ "$RUNNER_OS" = "Windows" ]; then
          choco install -y luajit php ruby python3
          export PATH="/c/tools/ruby34/bin:/c/tools/php:/c/tools/luajit:$PATH"
        fi
        npm install cmake-js -g
        nimble install -y https://github.com/nimbase/nimbase
      pre-test-command: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          export PATH="/c/tools/ruby34/bin:/c/tools/php:/c/tools/luajit:$PATH"
        fi
        if [ "$RUNNER_OS" = "Linux" ]; then
          clue task ruby
          clue task php
          clue task python
          clue task lua
        elif [ "$RUNNER_OS" = "macOS" ]; then
          clue task ruby
          clue task php
          clue task python
          clue task lua
        elif [ "$RUNNER_OS" = "Windows" ]; then
          clue task php
          clue task python
          clue task lua
        fi
